services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartslot
      POSTGRES_PASSWORD: smartslot
      POSTGRES_DB: smartslot
    ports:
      - "5432:5432"
    volumes:
      - smartslot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartslot -d smartslot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  smartslot_pg:
